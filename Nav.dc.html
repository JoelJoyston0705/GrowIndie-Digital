<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
.__brand-text,.__nav-links-desktop a,.__nav-links-mobile a{white-space:nowrap;}
.__nav-links-mobile{display:none;}
a,button{transition:transform 0.16s ease,box-shadow 0.18s ease,filter 0.16s ease,background-color 0.16s ease,border-color 0.16s ease;}
button:hover:not(:disabled){filter:brightness(1.07);}
a:active,button:active:not(:disabled){transform:translateY(1px);}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px;}
@media (max-width:1024px){
  .__nav-links-desktop{display:none !important;}
  .__nav-links-mobile{display:flex !important;gap:22px;overflow-x:auto;padding:14px 20px;border-bottom:1px solid var(--border);background:oklch(100% 0 0 / 0.92);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .__nav-links-mobile::-webkit-scrollbar{display:none;}
  .__nav-links-mobile a{padding:8px 0;}
}
@media (max-width:600px){
  .__lang-btn{min-height:40px;padding:0 16px !important;}
  .__cta-btn{min-height:44px;display:inline-flex;align-items:center;}
}
</style>
</helmet>
<div style="position:sticky;top:0;z-index:100;background:oklch(100% 0 0 / 0.78);backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--border);font-family:'Inter','Hind Madurai',sans-serif;">
  <div style="max-width:1280px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;row-gap:12px;">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img src="assets/logo-gold.png" alt="GrowIndie Digital" width="34" height="34" decoding="async" style="width:34px;height:34px;object-fit:contain;" />
      <span class="__brand-text" style="font-family:'Inter Tight',sans-serif;font-weight:800;font-size:18px;color:var(--text);">Grow Indie <span style="font-weight:500;color:var(--text-muted);">Digital</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;" class="__nav-links-desktop">
      <a href="About.dc.html" style="{{ navAboutStyle }}">{{ t.navAbout }}</a>
      <a href="Services.dc.html" style="{{ navServicesStyle }}">{{ t.navServices }}</a>
      <a href="Industries.dc.html" style="{{ navIndustriesStyle }}">{{ t.navIndustries }}</a>
      <a href="Pricing.dc.html" style="{{ navPricingStyle }}">{{ t.navPricing }}</a>
      <a href="Testimonials.dc.html" style="{{ navTestiStyle }}">{{ t.navTestimonials }}</a>
      <a href="FAQ.dc.html" style="{{ navFaqStyle }}">{{ t.navFaq }}</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:3px;">
        <button class="__lang-btn" onclick="{{ setLangEn }}" style="{{ langBtnStyleEn }}">EN</button>
        <button class="__lang-btn" onclick="{{ setLangTa }}" style="{{ langBtnStyleTa }}">தமிழ்</button>
      </div>
      <a class="__cta-btn" href="Contact.dc.html" style="background:var(--gradient);color:white;font-size:14.5px;font-weight:700;padding:13px 22px;border-radius:100px;box-shadow:0 8px 20px -8px oklch(46% 0.035 78 / 0.55);white-space:nowrap;">{{ t.navCta }}</a>
    </div>
  </div>
  <div class="__nav-links-mobile">
    <a href="About.dc.html" style="font-size:14px;font-weight:600;color:var(--text);">{{ t.navAbout }}</a>
    <a href="Services.dc.html" style="font-size:14px;font-weight:600;color:var(--text);">{{ t.navServices }}</a>
    <a href="Industries.dc.html" style="font-size:14px;font-weight:600;color:var(--text);">{{ t.navIndustries }}</a>
    <a href="Pricing.dc.html" style="font-size:14px;font-weight:600;color:var(--text);">{{ t.navPricing }}</a>
    <a href="Testimonials.dc.html" style="font-size:14px;font-weight:600;color:var(--text);">{{ t.navTestimonials }}</a>
    <a href="FAQ.dc.html" style="font-size:14px;font-weight:600;color:var(--text);">{{ t.navFaq }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:72},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('gi-lang')) || 'en' };

  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: e.detail });
    window.addEventListener('gi-lang', this._onLang);
    this.syncHtmlLang();
  }
  componentDidUpdate() { this.syncHtmlLang(); }
  componentWillUnmount() { window.removeEventListener('gi-lang', this._onLang); }

  syncHtmlLang() {
    const l = this.state.lang === 'ta' ? 'ta' : 'en';
    if (document.documentElement.lang !== l) document.documentElement.lang = l;
  }

  setLang(l) {
    this.setState({ lang: l });
    try { localStorage.setItem('gi-lang', l); } catch (e) {}
    window.dispatchEvent(new CustomEvent('gi-lang', { detail: l }));
  }

  langBtnStyle(lang, name) {
    const active = lang === name;
    return `padding:8px 14px;border-radius:100px;border:none;background:${active ? 'var(--gradient)' : 'transparent'};color:${active ? 'white' : 'var(--text-muted)'};font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;min-height:36px;`;
  }

  renderVals() {
    const lang = this.state.lang;
    const t = (window.GI_T && window.GI_T[lang]) || {};
    const current = this.props.current;
    const linkStyle = (key) => `font-size:14.5px;font-weight:600;color:${current === key ? 'var(--primary)' : 'var(--text)'};`;
    return {
      t, lang,
      navAboutStyle: linkStyle('about'), navServicesStyle: linkStyle('services'), navIndustriesStyle: linkStyle('industries'),
      navPricingStyle: linkStyle('pricing'), navTestiStyle: linkStyle('testimonials'), navFaqStyle: linkStyle('faq'),
      langBtnStyleEn: this.langBtnStyle(lang, 'en'), langBtnStyleTa: this.langBtnStyle(lang, 'ta'),
      setLangEn: (e) => { this.setLang('en'); e.currentTarget.blur(); },
      setLangTa: (e) => { this.setLang('ta'); e.currentTarget.blur(); }
    };
  }
}
</script>
</body>
</html>
