a{color:var(--primary);text-decoration:none;}
button{cursor:pointer;}
button:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px;}
.__skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--text);color:white;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:700;}

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('gi-lang')) || 'en', faqOpen: [false, false, false, false, false] };
  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: e.detail });
    window.addEventListener('gi-lang', this._onLang);
  }
  componentWillUnmount() { window.removeEventListener('gi-lang', this._onLang); }
  renderVals() {
    const { faqOpen } = this.state;
    const t = (window.GI_T && window.GI_T[this.state.lang]) || {};
    const toggleFaqAt = (i) => () => this.setState((s) => { const f = [...s.faqOpen]; f[i] = !f[i]; return { faqOpen: f }; });
    return {
      t,
      faqOpen0: faqOpen[0], faqOpen1: faqOpen[1], faqOpen2: faqOpen[2], faqOpen3: faqOpen[3], faqOpen4: faqOpen[4],
      faqIcon0: faqOpen[0] ? '−' : '+', faqIcon1: faqOpen[1] ? '−' : '+', faqIcon2: faqOpen[2] ? '−' : '+', faqIcon3: faqOpen[3] ? '−' : '+', faqIcon4: faqOpen[4] ? '−' : '+',
      toggleFaq0: toggleFaqAt(0), toggleFaq1: toggleFaqAt(1), toggleFaq2: toggleFaqAt(2), toggleFaq3: toggleFaqAt(3), toggleFaq4: toggleFaqAt(4)
    };
  }
}
</script>
